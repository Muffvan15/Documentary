<style>
/* Layout: a filing-cabinet index. Sticky filter bar, then a grid of case-file cards with a stamped category tab. */
:root{
  --bg:#eceee9; --surface:#f7f8f5; --ink:#1b2227; --muted:#5d6a70; --line:#cfd5d0;
  --accent:#b3361f; --accent-ink:#ffffff; --ok:#2f6b4f;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181c; --surface:#1a2227; --ink:#e6eaea; --muted:#8fa0a6; --line:#2d393f;
  --accent:#ec6a4f; --accent-ink:#12181c; --ok:#6fc29a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --surface:#1a2227; --ink:#e6eaea; --muted:#8fa0a6; --line:#2d393f;
  --accent:#ec6a4f; --accent-ink:#12181c; --ok:#6fc29a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto}
header{padding-block:28px 18px;display:flex;flex-direction:column;gap:6px}
.kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(40px,8vw,72px);line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.lede{max-width:62ch;color:var(--muted);margin:6px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-block:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,.tog,select,input[type=search]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 12px;min-height:36px}
.chip,.tog{cursor:pointer;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.chip[aria-pressed=true],.tog[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:focus-visible,.tog:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{flex:1 1 180px;min-width:0}
.count{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px 16px;padding-top:22px}
.card{min-width:0;display:flex;flex-direction:column;gap:8px}
.thumb{position:relative;display:block;aspect-ratio:16/9;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;color:inherit;text-decoration:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;font-family:var(--font-mono);font-size:11px;color:var(--muted);
  background:repeating-linear-gradient(135deg,transparent 0 10px,var(--line) 10px 11px)}
.tab{position:absolute;left:0;top:0;background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-bottom-right-radius:4px}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(10,14,16,.86);color:#fff;font-family:var(--font-mono);font-size:11px;padding:2px 6px;border-radius:3px;font-variant-numeric:tabular-nums}
.card.seen .thumb img{opacity:.45}
.seenmark{position:absolute;left:6px;bottom:6px;background:var(--ok);color:var(--bg);font-family:var(--font-mono);font-size:10.5px;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.08em}
.title{font-weight:600;font-size:15px;line-height:1.3;margin:0;text-wrap:balance}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline}
.meta{font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{font:inherit;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:none;border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer;min-height:30px}
.acts button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.empty{padding:48px 0;color:var(--muted);text-align:center}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;max-width:78ch}
footer p{margin:0 0 8px}
[lang=ar] body,[lang=ar] .title,[lang=ar] .lede{font-family:"IBM Plex Sans Arabic",var(--font-body)}
[lang=ar] h1{font-family:"IBM Plex Sans Arabic",var(--font-display);text-transform:none;line-height:1.15}
[lang=ar] .count{margin-left:0;margin-right:auto}
.langs{display:flex;gap:6px;margin-bottom:6px}
.langs .chip{min-width:44px;text-align:center}
.tab{left:auto}
.tab{inset-inline-start:0;border-radius:0 0 4px 0}
[dir=rtl] .tab{border-radius:0 0 0 4px}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  </div>
  <main class="grid" id="grid"></main>
  <footer>
    <p data-i="foot"></p>
  </footer>
</div>

const fmtV=n=>!n?"":(n>=1e6?(n/1e6).toFixed(1)+"M":Math.round(n/1e3)+"K")+tr("views");
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function buildCats(){
  $("#cats").innerHTML=CATK.map(k=>`<button class="chip" data-k="${k}" aria-pressed="${st.cat===k}">${esc(tr(k))}</button>`).join("");
}
function view(){
  let a=DATA.filter(v=>(st.cat==="all"||v.k===st.cat)&&(!st.long||v.s>=2700)&&(!st.hide||!st.seen[v.id])&&(!st.q||(v.t+" "+v.c).toLowerCase().includes(st.q)));
  if(st.sort==="pop")a.sort((x,y)=>y.v-x.v);
  else if(st.sort==="len")a.sort((x,y)=>y.s-x.s);
  else a.sort((x,y)=>x.t.localeCompare(y.t));
  $("#count").textContent=a.length+tr("of")+DATA.length+tr("files");
  $("#grid").innerHTML=a.length?a.map(v=>{
    const url="https://www.youtube.com/watch?v="+v.id;
    const meta=[v.c,fmtV(v.v)].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("");
    return `<article class="card${st.seen[v.id]?" seen":""}" data-id="${v.id}">
      <a class="thumb" href="${url}" target="_blank" rel="noopener" aria-label="${tr("watch")}${esc(v.t)}">
        <span class="ph">${v.id}</span>
        <img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/hq2.jpg" data-n="0">
        <span class="tab">${esc(LBL(v.k))}</span>
        ${v.s?`<span class="dur">${fmtD(v.s)}</span>`:""}
        ${st.seen[v.id]?`<span class="seenmark">${tr("seen")}</span>`:""}
      </a>
      <h2 class="title"><a href="${url}" target="_blank" rel="noopener">${esc(v.t)}</a></h2>
      <div class="meta">${meta}</div>
      <div class="acts">
        <button data-a="seen" aria-pressed="${!!st.seen[v.id]}">${st.seen[v.id]?tr("seen"):tr("mark")}</button>
        <button data-a="save" aria-pressed="${!!st.saved[v.id]}">${st.saved[v.id]?tr("saved"):tr("save")}</button>
      </div>
    </article>`}).join(""):`<p class="empty">${tr("empty")}</p>`;
}
document.addEventListener("error",e=>{
  const i=e.target;if(!(i instanceof HTMLImageElement))return;
  const id=i.closest(".card")?.dataset.id;const n=+i.dataset.n;
  const f=["hq2.jpg","mqdefault.jpg"];
  if(id&&n<f.length-0&&n<1){i.dataset.n=n+1;i.src="https://i.ytimg.com/vi/"+id+"/mqdefault.jpg"}else i.remove();
},true);
$("#cats").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;st.cat=b.dataset.k;buildCats();view()});
$("#q").addEventListener("input",e=>{st.q=e.target.value.trim().toLowerCase();view()});
$("#sort").addEventListener("change",e=>{st.sort=e.target.value;view()});
$("#long").addEventListener("click",e=>{st.long=!st.long;e.currentTarget.setAttribute("aria-pressed",st.long);view()});
$("#hide").addEventListener("click",e=>{st.hide=!st.hide;e.currentTarget.setAttribute("aria-pressed",st.hide);view()});
$("#grid").addEventListener("click",e=>{
  const card=e.target.closest(".card");if(!card)return;const id=card.dataset.id;
  const b=e.target.closest("[data-a]");
  if(b){const m=b.dataset.a==="seen"?st.seen:st.saved;if(m[id])delete m[id];else m[id]=1;persist();view();return}
  if(e.target.closest("a")){st.seen[id]=1;persist();setTimeout(view,300)}
});
$("#langs").addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(!b)return;L=b.dataset.l;try{localStorage.setItem("dt_lang",L)}catch(x){}applyLang();buildCats();view()});
applyLang();buildCats();view();
</script>
